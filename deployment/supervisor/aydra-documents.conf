[program:aydra-documents]
process_name=%(program_name)s_%(process_num)02d
directory=%(ENV_AYDRA_ROOT)s
command="%(ENV_AYDRA_PHP)s" "%(ENV_AYDRA_ROOT)s/artisan" queue:work database --queue=saas-documents --sleep=2 --tries=1 --timeout=60 --max-time=3600 --no-interaction -v
user=%(ENV_AYDRA_USER)s
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=%(ENV_AYDRA_ROOT)s/storage/logs/documents-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
