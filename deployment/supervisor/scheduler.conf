[program:aydra-scheduler]
directory=%(ENV_AYDRA_ROOT)s
command="%(ENV_AYDRA_PHP)s" "%(ENV_AYDRA_ROOT)s/artisan" schedule:work --no-interaction
user=%(ENV_AYDRA_USER)s
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_AYDRA_ROOT)s/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
